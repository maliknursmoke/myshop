<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MYSHOP Admin</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <header>
    <h1>MYSHOP Admin</h1>
    <a href="/">View Shop</a>
  </header>

  <main>
    <section id="loginSection" class="panel">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <label>Username</label>
        <input name="username" value="admin" required>

        <label>Password</label>
        <input name="password" type="password" required>

        <button type="submit">Log In</button>
        <p id="loginMessage" class="message"></p>
      </form>
    </section>

    <section id="dashboard" hidden>
      <div class="toolbar">
        <h2>Admin Dashboard</h2>
        <button id="logoutButton" class="secondary">Log Out</button>
      </div>

      <!-- ORDER MANAGEMENT -->
      <section class="panel">
        <div class="toolbar">
          <h2>Customer Orders</h2>
          <button id="refreshOrdersButton" class="secondary">
            Refresh Orders
          </button>
        </div>

        <div id="orderSummary"></div>
        <div id="orderList">Loading orders...</div>
      </section>

      <!-- PRODUCT MANAGEMENT -->
      <section class="panel">
        <h2>Product Management</h2>
        <h3 id="formTitle">Add New Product</h3>

        <form id="productForm">
          <input type="hidden" name="id">

          <label>Product name</label>
          <input name="name" maxlength="120" required>

          <label>Price (ETB)</label>
          <input name="price" type="number" min="0" step="0.01" required>

          <label>Category</label>
          <input name="category" maxlength="80" required>

          <label>Product image URL</label>
          <input name="image" type="url" maxlength="2000" required
                 placeholder="https://example.com/image.jpg">

          <label>Description</label>
          <textarea name="description" maxlength="2000" rows="3"></textarea>

          <label>Stock quantity</label>
          <input name="stock" type="number" min="0" step="1" required value="20">

          <div class="actions">
            <button type="submit" id="saveButton">Add Product</button>
            <button type="button" id="cancelEdit" class="secondary" hidden>
              Cancel Edit
            </button>
          </div>

          <p id="formMessage" class="message"></p>
        </form>
      </section>

      <section class="panel">
        <div class="toolbar">
          <h3>Your Products</h3>
          <button id="refreshButton" class="secondary">Refresh</button>
        </div>
        <div id="productList">Loading products...</div>
      </section>
    </section>
  </main>
</body>
</html>
